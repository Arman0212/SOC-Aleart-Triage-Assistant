[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nullpunkt"
version = "0.1.0"
description = "AI-assisted SOC alert triage with asset-aware risk, MITRE ATT&CK mapping and analyst-approved briefs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Team Nullpunkt" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "networkx>=3.3",
    "faker>=40.0,<41",
    "streamlit>=1.40",
    "ollama>=0.4",
    "tzdata; sys_platform == \"win32\"",
]

[project.scripts]
nullpunkt-generate = "nullpunkt.generator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16", "pre-commit>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]