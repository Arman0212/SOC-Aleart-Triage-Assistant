name: Docker image

# Builds the demo image on every push to main and on PRs: size check (max 500 MB), an in-image
# smoke test and a live server check. Tags v* (and manual runs) also push it to GHCR as
# ghcr.io/<owner>/nullpunkt:<tag> and :latest. See docs/deployment.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAX_IMAGE_MB: 500
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used when publishing
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nullpunkt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          bytes=$(docker image inspect nullpunkt:ci --format '{{.Size}}')
          mb=$(( bytes / 1000000 ))
          {
            echo "### Image size: ${mb} MB uncompressed (limit ${MAX_IMAGE_MB} MB)"
            echo
            echo '| Layer size | Created by |'
            echo '|---|---|'
            docker history nullpunkt:ci --format '{{.Size}}|{{.CreatedBy}}' \
              | grep -v '^0B|' | head -n 12 \
              | awk -F'|' '{ printf "| %s | `%s` |\n", $1, substr($2, 1, 90) }'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image size: ${mb} MB"
          if [ "$mb" -gt "$MAX_IMAGE_MB" ]; then
            echo "::error::image is ${mb} MB, over the ${MAX_IMAGE_MB} MB limit"
            exit 1
          fi

      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id nullpunkt:ci -u)" = "10001"

      - name: Smoke test (renders the app inside the image)
        run: |
          docker run --rm -v "$PWD/docker/smoke_test.py:/tmp/smoke_test.py:ro" \
            --entrypoint sh nullpunkt:ci -c "nullpunkt-demo-reset && python /tmp/smoke_test.py"

      - name: Server check (entrypoint, health endpoint, index page)
        run: |
          docker run -d --name nullpunkt -p 8501:8501 nullpunkt:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8501/_stcore/health && break
            sleep 1
          done
          echo
          curl -sf http://127.0.0.1:8501/_stcore/health | grep -q ok
          curl -sf -o /dev/null http://127.0.0.1:8501/
          docker logs nullpunkt 2>&1 | grep -q "restored"

      - name: Container log
        if: always()
        run: docker logs nullpunkt 2>&1 | tail -n 30 || true

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: env.PUBLISH == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nullpunkt"
          tag="${GITHUB_REF_NAME//\//-}"
          for t in "$tag" latest; do
            docker tag nullpunkt:ci "$image:$t"
            docker push "$image:$t"
          done
          digest=$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')
          {
            echo "### Published"
            echo "- \`$image:$tag\`"
            echo "- \`$image:latest\`"
            echo "- digest \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
